name: build

# G5 prep: build the GDExtension for every desktop (platform, arch) target
# on every push -- macOS arm64, Linux x86_64, Linux arm64, Windows x86_64.
# We compile libturi.a from the sibling turmeric repo first (the GDExtension
# statically links it) and then drive the standard godot-cpp SCons setup for
# each target. Linux arm64 builds natively on a GitHub arm64 runner.
#
# Per-platform binaries land under examples/spike/bin/ and are uploaded
# as workflow artifacts so a reviewer can grab a build off any commit.
#
# macOS code-signing (G5 polish):
#   The macOS .dylib gets ad-hoc signed unconditionally so the build host
#   does not produce a flagged "no signature" binary. For distribution,
#   real signing + notarization runs ONLY when these secrets are set in
#   the repo (Settings -> Secrets and variables -> Actions):
#     APPLE_CERTIFICATE_BASE64   -- the Developer ID Application .p12 cert,
#                                   base64-encoded (`base64 -i cert.p12 | pbcopy`)
#     APPLE_CERTIFICATE_PASSWORD -- password for that .p12
#     APPLE_KEYCHAIN_PASSWORD    -- a one-off password for the temp keychain
#     APPLE_SIGNING_IDENTITY     -- e.g. "Developer ID Application: Acme (TEAMID)"
#     APPLE_TEAM_ID              -- the 10-character team id
#     APPLE_NOTARY_USER          -- Apple ID (email)
#     APPLE_NOTARY_PASSWORD      -- app-specific password from appleid.apple.com
#   When unset, the signing + notarization steps no-op and the build still
#   succeeds; the artifact ships ad-hoc signed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  TURMERIC_REPO: https://github.com/rjungemann/turmeric.git
  # The compiler checkout lives INSIDE the workspace (see the checkout step),
  # so SConstruct's default of ../turmeric no longer finds it. It reads this.
  #
  # RELATIVE, deliberately. This was `${{ github.workspace }}/turmeric`, and on
  # the MSYS2 leg the drive letter did not survive the trip into the shell --
  # SCons reported the dependency as:
  #
  #   `\a\turmeric-godot\turmeric-godot/turmeric/build-rel/src/libturi.a'
  #
  # with the leading `D:` gone. That failed in a genuinely confusing way rather
  # than an obvious one: a path beginning `\` is drive-RELATIVE on Windows, so
  # SConstruct's own os.path.isfile() probe resolved it against the current
  # drive and happily reported the archive found. Everything compiled. Only
  # SCons's node/dependency layer disagreed, at the final link.
  #
  # SCons resolves a relative path against the SConstruct directory, which is
  # where every step that reads this already runs, so a bare `turmeric` is
  # correct on all four legs and has no drive letter to lose. The two libturi
  # build steps use `working-directory:` instead and are unaffected.
  TURMERIC_ROOT: turmeric

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,          platform: macos,   arch: arm64,  lib_suffix: framework, scons_extra: "" }
          - { os: ubuntu-22.04,      platform: linux,   arch: x86_64, lib_suffix: so,        scons_extra: "" }
          - { os: ubuntu-22.04-arm,  platform: linux,   arch: arm64,  lib_suffix: so,        scons_extra: "" }
          # use_mingw=yes is not optional. godot-cpp's windows tool picks MSVC
          # whenever `not use_mingw and msvc.exists(env)` (tools/windows.py:86),
          # and MSVC *does* exist on this runner -- so without it SCons would
          # build the shim with a different toolchain than libturi.a, which the
          # shim links statically.
          - { os: windows-2022,      platform: windows, arch: x86_64, lib_suffix: dll,       scons_extra: "use_mingw=yes" }
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        # MSYS2 on Windows so gcc/cmake/ninja/scons from UCRT64 are the ones on
        # PATH. Everywhere else the steps are already written for a POSIX shell
        # (`set -euo pipefail`, find | xargs), so name bash rather than inherit
        # pwsh on the Windows leg by accident.
        shell: ${{ matrix.platform == 'windows' && 'msys2 {0}' || 'bash' }}

    steps:
      - name: Checkout turmeric-godot (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # `path:` MUST stay inside the workspace. This step used to say
      # `../turmeric`, mirroring the sibling-checkout layout developers use
      # locally, and actions/checkout refuses it outright:
      #
      #   Repository path '/home/runner/work/turmeric-godot/turmeric' is not
      #   under '/home/runner/work/turmeric-godot/turmeric-godot'
      #
      # Every matrix leg died there in ~6 seconds, which is why this workflow
      # had never once produced a green build on ANY platform -- Windows was
      # not specially broken, nothing was ever compiled at all.
      #
      # The compiler is pinned to a RELEASED TAG rather than floating to main.
      # An unpinned dependency turns this job red for reasons that have nothing
      # to do with the commit under test, and the shim links libturi.a
      # statically -- so "which turmeric" is part of what a green run attests.
      - name: Checkout sibling turmeric
        uses: actions/checkout@v4
        with:
          repository: rjungemann/turmeric
          ref: v0.44.2
          path: turmeric

      # Windows is a MinGW-w64 / UCRT64 build, which SConstruct's header states
      # outright: "run this from an MSYS2 UCRT64 shell, and build godot-cpp with
      # use_mingw=yes". The first CI run to get this far proved why -- with the
      # stock runner toolchain CMake selected Visual Studio 17 2022 and MSVC
      # rejected turmeric's GCC warning flags in 53 seconds:
      #
      #   cl : command line error D8021: invalid numeric argument '/Wextra'
      #
      # It is not merely that turmeric wants GCC. libturi.a is linked
      # STATICALLY into the shim, so both halves have to come from one
      # toolchain; building the shim with MSVC against a MinGW archive is not a
      # thing that links.
      #
      # scons comes from pacman rather than pip: the UCRT64 package installs
      # into the same python that is on PATH inside this shell, whereas
      # actions/setup-python would put a *Windows* python ahead of it.
      - name: Setup MSYS2 (Windows)
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-scons

      - name: Setup Python
        if: matrix.platform != 'windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SCons
        if: matrix.platform != 'windows'
        run: python -m pip install --upgrade scons

      # libturi.a comes from the sibling turmeric checkout. We build it
      # in Release because the GDExtension we ship is template_debug --
      # mixing a Debug libturi would pull in ASan and break the link.
      # POSITION_INDEPENDENT_CODE is required on Linux: libturi.a is linked
      # into the GDExtension .so, and ld rejects non-PIC objects in a shared
      # object (R_X86_64_TPOFF32 relocation against the TLS globals). It is a
      # no-op on macOS, which compiles PIC by default.
      - name: Build libturi.a (macos/linux)
        if: matrix.platform != 'windows'
        working-directory: turmeric
        run: |
          cmake -S . -B build-rel -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build build-rel --target libturi -j

      # -G Ninja pins the generator explicitly. Without it CMake defaults to
      # Visual Studio even from inside the MSYS2 shell, which is exactly the
      # failure this leg has already produced once. Ninja is also single-config,
      # so CMAKE_BUILD_TYPE is what selects Release and the old `--config
      # Release` on the build line is meaningless here and dropped.
      - name: Build libturi.a (windows)
        if: matrix.platform == 'windows'
        working-directory: turmeric
        run: |
          cmake -S . -B build-rel -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build-rel --target libturi -j

      - name: Build GDExtension (template_debug)
        run: python -m SCons platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=template_debug ${{ matrix.scons_extra }} -j2

      - name: Build GDExtension (template_release)
        run: python -m SCons platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=template_release ${{ matrix.scons_extra }} -j2

      # macOS-only: ad-hoc sign so the build host doesn't leave the dylib
      # flagged as "unsigned." Cheap, always runs, no secrets required.
      # Distribution-grade signing is the next step below.
      - name: Ad-hoc sign macOS dylib
        if: matrix.platform == 'macos'
        run: |
          find examples/spike/bin -name '*.dylib' -print0 | \
            xargs -0 -I{} codesign --force --sign - --timestamp=none {}

      # Distribution-grade signing + notarization. Gated on the certificate
      # secret -- when unset (the common PR case) the step is skipped.
      - name: Sign and notarize macOS dylib
        if: matrix.platform == 'macos' && env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64:   ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD:    ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY:     ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID:              ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_USER:          ${{ secrets.APPLE_NOTARY_USER }}
          APPLE_NOTARY_PASSWORD:      ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          # 1. Build a temp keychain and import the .p12.
          KC="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | xargs)
          echo "$APPLE_CERTIFICATE_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$APPLE_KEYCHAIN_PASSWORD" "$KC"

          # 2. Sign every .dylib with timestamping + hardened runtime
          # (notarization requires both).
          find examples/spike/bin -name '*.dylib' -print0 | while IFS= read -r -d '' DYLIB; do
            codesign --force --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" "$DYLIB"
            codesign --verify --strict --verbose=2 "$DYLIB"
          done

          # 3. Notarize. .dylibs are notarized inside a zip envelope.
          ZIP="$RUNNER_TEMP/notarize.zip"
          (cd examples/spike/bin && zip -r "$ZIP" . -i '*.dylib')
          xcrun notarytool submit "$ZIP" \
            --apple-id "$APPLE_NOTARY_USER" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --wait
          # .dylibs (as opposed to .app bundles) cannot be stapled; gatekeeper
          # consults the notarization log online instead. No `stapler` step.

          # 4. Tear the temp keychain down.
          security delete-keychain "$KC"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: turmeric-godot-${{ matrix.platform }}-${{ matrix.arch }}
          path: examples/spike/bin/**
          if-no-files-found: error
          retention-days: 14
